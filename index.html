    .actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; font-size: 15px;
      background: #1976d2; color: #fff; box-shadow: var(--shadow);
    }
    button:hover { filter: brightness(.95); }
    @keyframes fade { from { opacity:0; transform: translateY(8px)} to { opacity:1; transform: translateY(0)} }
